apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    name: console-cluster-example-org-tls
  name: console-cluster-example-org-tls
  namespace: openshift-console
spec:
  dnsNames:
    - console.cluster.example.org
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-staging
  secretName: console-cluster-example-org-tls
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    name: openshift4-console-sync-console-cluster-example-org-tls
  name: openshift4-console-sync-console-cluster-example-org-tls
  namespace: openshift-console
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    name: openshift4-console-sync-console-cluster-example-org-tls
  name: openshift4-console-sync-console-cluster-example-org-tls
  namespace: openshift-console
rules:
  - apiGroups:
      - ''
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    name: openshift4-console-sync-console-cluster-example-org-tls
  name: openshift4-console-sync-console-cluster-example-org-tls
  namespace: openshift-config
rules:
  - apiGroups:
      - ''
    resources:
      - secrets
    verbs:
      - get
      - create
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    name: openshift4-console-sync-console-cluster-example-org-tls
  name: openshift4-console-sync-console-cluster-example-org-tls
  namespace: openshift-console
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openshift4-console-sync-console-cluster-example-org-tls
subjects:
  - kind: ServiceAccount
    name: openshift4-console-sync-console-cluster-example-org-tls
    namespace: openshift-console
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    name: openshift4-console-sync-console-cluster-example-org-tls
  name: openshift4-console-sync-console-cluster-example-org-tls
  namespace: openshift-config
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openshift4-console-sync-console-cluster-example-org-tls
subjects:
  - kind: ServiceAccount
    name: openshift4-console-sync-console-cluster-example-org-tls
    namespace: openshift-console
---
apiVersion: espejote.io/v1alpha1
kind: ManagedResource
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    syn.tools/description: "Watches for the certificate secret created by cert-manager\
      \ in the web console namespace and copies it to the openshift-config namespace,\
      \ where the web console picks it up from. \n"
    syn.tools/managed-by: espejote
  labels:
    app.kubernetes.io/name: copy-tls-secret-console-cluster-example-org-tls
  name: copy-tls-secret-console-cluster-example-org-tls
  namespace: openshift4-console
spec:
  serviceAccountRef:
    name: openshift4-console-sync-console-cluster-example-org-tls
  template: |
    local esp = import 'espejote.libsonnet';
    local triggerData = esp.triggerData().resource;
    triggerData {
      metadata+: {
        namespace: 'openshift-config',
        labels+: {
          'espejote.io/created-by': 'copy-tls-secret-console-cluster-example-org-tls',
          'app.kubernetes.io/managed-by': 'espejote',
        }
      },
    }
  triggers:
    - name: copy-tls-secret
      watchResource:
        apiVersion: v1
        kind: Secret
        name: console-cluster-example-org-tls
