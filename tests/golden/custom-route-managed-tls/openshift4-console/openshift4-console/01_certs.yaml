apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    name: console-cluster-example-org-tls
  name: console-cluster-example-org-tls
  namespace: openshift-console
spec:
  dnsNames:
    - console.cluster.example.org
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-staging
  secretName: console-cluster-example-org-tls
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    name: openshift4-console-sync-console-cluster-example-org-tls
  name: openshift4-console-sync-console-cluster-example-org-tls
  namespace: openshift-console
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    name: openshift4-console-sync-console-cluster-example-org-tls
  name: openshift4-console-sync-console-cluster-example-org-tls
  namespace: openshift-console
rules:
  - apiGroups:
      - ''
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    name: openshift4-console-sync-console-cluster-example-org-tls
  name: openshift4-console-sync-console-cluster-example-org-tls
  namespace: openshift-config
rules:
  - apiGroups:
      - ''
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    name: openshift4-console-sync-console-cluster-example-org-tls
  name: openshift4-console-sync-console-cluster-example-org-tls
  namespace: openshift-console
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openshift4-console-sync-console-cluster-example-org-tls
subjects:
  - kind: ServiceAccount
    name: openshift4-console-sync-console-cluster-example-org-tls
    namespace: openshift-console
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    name: openshift4-console-sync-console-cluster-example-org-tls
  name: openshift4-console-sync-console-cluster-example-org-tls
  namespace: openshift-config
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openshift4-console-sync-console-cluster-example-org-tls
subjects:
  - kind: ServiceAccount
    name: openshift4-console-sync-console-cluster-example-org-tls
    namespace: openshift-console
---
apiVersion: espejote.io/v1alpha1
kind: ManagedResource
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    syn.tools/description: |
      Watches for the certificate secret created by cert-manager in the
      web console namespace and copies it to the openshift-config namespace,
      where the web console picks it up from.
  labels:
    app.kubernetes.io/component: openshift4-console
    app.kubernetes.io/managed-by: commodore
    app.kubernetes.io/name: copy-tls-secret-console-cluster-example-org-tls
    app.kubernetes.io/part-of: syn
  name: copy-tls-secret-console-cluster-example-org-tls
  namespace: openshift-console
spec:
  applyOptions:
    force: true
  context:
    - name: source_secret
      resource:
        apiVersion: v1
        kind: Secret
        name: console-cluster-example-org-tls
        namespace: openshift-console
  serviceAccountRef:
    name: openshift4-console-sync-console-cluster-example-org-tls
  template: |
    local esp = import 'espejote.libsonnet';
    local inDelete(obj) = std.get(obj.metadata, 'deletionTimestamp', '') != '';

    local configNs = 'openshift-config';
    local source = esp.context().source_secret;
    assert
      std.length(source) == 1
      : 'Expected source context to have exactly 1 element';
    assert
      source[0].kind == 'Secret'
      : 'Expected source to be a `Secret`, is a `%s`' % source[0].kind;

    local sourceSecret = source[0];

    if sourceSecret != null && !inDelete(sourceSecret) then
      {
        apiVersion: sourceSecret.apiVersion,
        kind: sourceSecret.kind,
        metadata: {
          name: sourceSecret.metadata.name,
          namespace: configNs,
          annotations: sourceSecret.metadata.annotations,
          labels: sourceSecret.metadata.labels {
            'app.kubernetes.io/managed-by': 'espejote',
            'app.kubernetes.io/part-of': 'syn',
            'app.kubernetes.io/component': 'openshift4-console',
          },
        },
        type: sourceSecret.type,
        data: sourceSecret.data,
      }
    else
      esp.markForDelete(
        {
          apiVersion: sourceSecret.apiVersion,
          kind: sourceSecret.kind,
          metadata: {
            name: sourceSecret.metadata.name,
            namespace: configNs,
          },
        }
      )
  triggers:
    - name: watch-source-tls-secret
      watchContextResource:
        name: source_secret
    - name: watch-target-tls-secret
      watchResource:
        apiVersion: v1
        kind: Secret
        name: console-cluster-example-org-tls
        namespace: openshift-config
