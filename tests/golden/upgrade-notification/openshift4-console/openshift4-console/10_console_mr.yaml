apiVersion: v1
kind: ServiceAccount
metadata:
  name: operator-openshift-io-consoles-cluster-manager
  namespace: syn-espejote
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: syn-espejote:operator-openshift-io-consoles-cluster-manager
rules:
  - apiGroups:
      - operator.openshift.io
    resourceNames:
      - cluster
    resources:
      - consoles
    verbs:
      - '*'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: syn-espejote:operator-openshift-io-consoles-cluster-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: syn-espejote:operator-openshift-io-consoles-cluster-manager
subjects:
  - kind: ServiceAccount
    name: operator-openshift-io-consoles-cluster-manager
    namespace: syn-espejote
---
apiVersion: espejote.io/v1alpha1
kind: ManagedResource
metadata:
  labels:
    app.kubernetes.io/name: operator-openshift-io-consoles-cluster-manager
  name: operator-openshift-io-consoles-cluster-manager
  namespace: syn-espejote
spec:
  applyOptions:
    force: true
  serviceAccountRef:
    name: operator-openshift-io-consoles-cluster-manager
  template: |-
    {
        "apiVersion": "operator.openshift.io/v1",
        "kind": "Console",
        "metadata": {
            "name": "cluster"
        },
        "spec": {

        }
    }
  triggers:
    - name: target
      watchResource:
        apiVersion: operator.openshift.io/v1
        kind: Console
        name: cluster
