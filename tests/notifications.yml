parameters:
  kapitan:
    dependencies:
      - type: https
        source: https://raw.githubusercontent.com/projectsyn/component-espejote/master/lib/espejote.libsonnet
        output_path: vendor/lib/espejote.libsonnet

  facts:
    distribution: openshift4

  espejote:
    namespace: syn-espejote

  openshift4_console:
    notifications:
      standard:
        text: Standard Notification

      custom:
        text: Customized Notification
        location: BannerBottom
        color: '#1abc9c'
        backgroundColor: ' #d1d61c'
        link:
          href: https://docs.appuio.cloud
          text: APPUiO documentation
